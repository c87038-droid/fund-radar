name: 我的基金雷達｜基金自動更新與發布

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # UTC 01:15、10:15、15:15，臺灣時間 09:15、18:15、23:15
    - cron: '15 1,10,15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund-radar-deployment
  cancel-in-progress: false

jobs:
  update-and-publish:
    name: 更新基金淨值與配息並發布 GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取得基金網站程式
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 檢查基金程式（不執行已停用的匯率測試）
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/test_update_funds.py ]; then
            python -m unittest discover -s tests -p 'test_update_funds.py' -v
          fi
          if [ -f tests/test_nav_backup.py ]; then
            python -m unittest discover -s tests -p 'test_nav_backup.py' -v
          fi

      - name: 更新 7 檔基金淨值與配息
        run: python scripts/update_funds.py

      - name: 檢查基金更新資料
        shell: bash
        run: |
          set -euo pipefail
          test -s data/live.json
          python -m json.tool data/live.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/live.json').read_text(encoding='utf-8'))
          print('基金資料檢查時間:', data.get('checkedAt'))
          for fid, fund in (data.get('funds') or {}).items():
              print('基金:', fid, '淨值日期:', fund.get('navDate'), '淨值狀態:', fund.get('navStatus'))
          PY

      - name: 準備網站（三個獨立頁面、基金資料與圖示）
        shell: bash
        run: |
          set -euo pipefail
          # 先確認首頁、預估配息、匯率查詢三個檔案都存在，避免發布成功卻顯示 404。
          for page in index.html estimate.html fx.html; do
            if [ ! -s "$page" ]; then
              echo "::error::GitHub 專案根目錄缺少 $page，請先上傳該檔案"
              exit 1
            fi
          done
          mkdir -p _site/data
          cp index.html estimate.html fx.html _site/
          cp data/live.json _site/data/live.json
          for favicon in favicon.png favicon.ico; do
            if [ -s "$favicon" ]; then cp "$favicon" _site/; fi
          done
          touch _site/.nojekyll
          # 發布前再次驗證，Actions 日誌會清楚列出檔案。
          for page in index.html estimate.html fx.html; do
            test -s "_site/$page" || { echo "::error::_site/$page 未成功建立"; exit 1; }
          done
          echo '本次 GitHub Pages 要發布的檔案：'
          find _site -maxdepth 2 -type f | sort

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 發布網頁
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 嘗試儲存基金資料快照（失敗不影響網站發布）
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -m '更新基金資料快照'
            git push origin HEAD:main
          else
            echo '基金資料無變化'
          fi
