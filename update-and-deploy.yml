name: 我的基金雷達－淨值與配息更新、部署

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub Actions 排程使用 UTC：臺灣時間 09:15、18:15、23:15。
    - cron: '15 1,10,15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "fund-radar-pages"
  cancel-in-progress: false

jobs:
  fund-data-and-site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取得基金雷達檔案
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 測試基金資料辨識程式
        run: python -m unittest discover -s tests -v
      - name: 更新 7 檔基金的淨值及配息
        run: python scripts/update_funds.py
      - name: 保存基金資料更新狀態
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "更新7檔基金淨值與配息資料"
            git push
          fi
      - name: 啟用 Pages
        uses: actions/configure-pages@v5
      - name: 打包基金網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 發布基金網站
        id: deploy
        uses: actions/deploy-pages@v4
