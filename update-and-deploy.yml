name: 我的基金雷達｜基金與匯率自動更新發布

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # UTC 01:15、10:15、15:15 = 臺灣時間 09:15、18:15、23:15
    - cron: '15 1,10,15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund-radar-deployment
  cancel-in-progress: false

jobs:
  update-and-publish:
    name: 更新基金與臺灣銀行匯率並發布 GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取得基金網站程式
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 檢查基金辨識與日期邏輯
        run: python -m unittest discover -s tests -v

      - name: 更新 7 檔基金淨值與配息
        run: python scripts/update_funds.py

      - name: 取得臺灣銀行 USD / ZAR 即期匯率
        shell: bash
        run: |
          python scripts/update_fx.py
          python - <<'PYFX'
          import json
          from pathlib import Path

          p = Path('data/fx.json')
          if not p.is_file():
              raise SystemExit('::error::匯率程式沒有產生 data/fx.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print('匯率檢查時間:', d.get('checkedAt'))
          print('匯率來源:', d.get('source'), d.get('sourceUrl'))
          print('匯率更新訊息:', d.get('message'))
          for code in ('USD', 'ZAR'):
              row = (d.get('rates') or {}).get(code) or {}
              buy, sell = row.get('buy'), row.get('sell')
              print(f'{code} 即期買進={buy}, 即期賣出={sell}, 牌告={row.get("quotedAt")}, 狀態={row.get("status")}')
              if not isinstance(buy, (int, float)) or not isinstance(sell, (int, float)):
                  print(f'::warning::{code} 尚無有效即期報價')
              elif row.get('status') != 'found':
                  print(f'::warning::{code} 顯示的是有日期標記的備援舊報價，非本次成功擷取')
          PYFX

      - name: 輸出基金更新診斷
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data/live.json').read_text(encoding='utf-8'))
          print('基金更新檢查時間:', d.get('checkedAt'))
          for key, v in d.get('sources', {}).items():
              print('來源:', key, '成功:', v.get('ok'), '筆數:', v.get('rows'), '錯誤:', v.get('message'))
          for fid, v in d.get('funds', {}).items():
              print('基金:', fid, '淨值日期:', v.get('navDate'), '淨值狀態:', v.get('navStatus'),
                    '配息筆數:', len(v.get('dividends', [])), '提醒:', v.get('navMessage', ''))
          PY

      - name: 準備網站（包含基金資料與匯率資料）
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          touch _site/.nojekyll
          cp data/live.json _site/data/live.json
          cp data/fx.json _site/data/fx.json
          test -s _site/data/fx.json || { echo '::error::部署資料夾缺少 data/fx.json'; exit 1; }
          python -m json.tool _site/data/fx.json >/dev/null
          echo '此次即將發布的檔案：'
          find _site -maxdepth 2 -type f | sort

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網頁（含 data/fx.json）
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 發布網頁
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 儲存基金與匯率資料快照（失敗不影響網頁發布）
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live.json data/fx.json
          if ! git diff --cached --quiet; then
            git commit -m '自動更新基金及匯率資料快照'
            git push origin HEAD:main
          else
            echo '資料快照無變化'
          fi
