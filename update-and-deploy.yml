name: 我的基金雷達｜自動更新與發布

on:
  workflow_dispatch:
  schedule:
    # UTC 01:15 / 10:15 / 15:15 = 台灣時間 09:15 / 18:15 / 23:15
    - cron: '15 1,10,15 * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund-radar-single-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 更新基金、匯率並部署完整網站
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取得網站檔案
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 更新 7 檔基金（匯率更新不受基金來源失敗影響）
        shell: bash
        run: |
          if [ -f scripts/update_funds.py ]; then
            python scripts/update_funds.py || echo '::warning::基金來源暫時失敗，沿用原有基金資料'
          elif [ -f update_funds.py ]; then
            python update_funds.py || echo '::warning::基金來源暫時失敗，沿用原有基金資料'
          else
            echo '::warning::找不到基金更新程式，保留現有基金資料'
          fi

      - name: 取得臺灣銀行 USD / ZAR 即期匯率
        shell: bash
        run: |
          python -m py_compile scripts/update_fx.py
          python scripts/update_fx.py
          python - <<'PYFX'
          import json
          from pathlib import Path
          p=Path('data/fx.json')
          assert p.is_file(), '找不到 data/fx.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          for c in ['USD','ZAR']:
              row=(d.get('rates') or {}).get(c) or {}
              print(c, '買進', row.get('buy'), '賣出', row.get('sell'), '狀態', row.get('status'),'牌告',row.get('quotedAt'))
              if row.get('status')!='found':
                  print('::warning::'+c+' 此次未取得新牌告，會顯示標明日期的舊資料（若有）')
          print('來源診斷:',d.get('message'))
          PYFX

      - name: 準備網站（一定包含 data/fx.json）
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          touch _site/.nojekyll
          if [ -d assets ]; then cp -a assets _site/assets; fi
          if [ -f data/live.json ]; then
            cp data/live.json _site/data/live.json
          elif [ -f live.json ]; then
            cp live.json _site/data/live.json
          else
            echo '::warning::基金 live.json 不存在，保留網頁提示'
          fi
          cp data/fx.json _site/data/fx.json
          test -s _site/data/fx.json
          python -m json.tool _site/data/fx.json >/dev/null
          echo '確認部署檔案：'
          find _site -type f | sort
          echo '網站匯率檔位置：'
          ls -lah _site/data/fx.json

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳含匯率資料的網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 發布網站
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 將已確認的匯率快照回存到 GitHub（失敗不影響網站）
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/fx.json
          if [ -f data/live.json ]; then git add -f data/live.json; fi
          if ! git diff --cached --quiet; then
            git commit -m '更新基金及匯率快照'
            git push origin HEAD:main
          else
            echo '快照未變動'
          fi
